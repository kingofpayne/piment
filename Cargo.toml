[package]
name = "piment"
description = "A GPU backed GUI library"
repository = "https://github.com/kingofpayne/piment"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
bytemuck = "1.23.2"
font-kit = "0.14"
glam = "0.33.7"
image = "0.25.8"
rand = "0.9.2"
serde = { version = "1.0.227", features = ["derive"] }
swash = "0.2.10"
wgpu = "27.0.1"
winit = "0.30.12"
pollster = "0.4"
moka = { version = "0.12.15", features = ["sync"] }
